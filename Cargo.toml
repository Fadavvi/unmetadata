[package]
name = "unmetadata"
version = "0.1.0"
edition = "2021"
description = "Strip all metadata from images, documents, audio, video, and more"

[[bin]]
name = "unmetadata"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive"] }
rayon      = "1"
walkdir    = "2"
thiserror  = "1"
anyhow     = "1"
img-parts  = "0.3"
lopdf      = { version = "0.33", default-features = false, features = ["nom_parser"] }
zip        = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd", "lzma"] }
quick-xml  = "0.36"
id3        = "1"
metaflac   = "0.2"
axum       = { version = "0.7", features = ["multipart"] }
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
http       = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
